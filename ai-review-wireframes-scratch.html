<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Review — Wireframes — Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: #111;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Sandbox header ── */
    .sandbox-header {
      height: 48px;
      background: #111;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      flex-shrink: 0;
      border-bottom: 1px solid #222;
    }
    .sandbox-header-back {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.45);
      text-decoration: none; transition: color 0.15s; white-space: nowrap;
    }
    .sandbox-header-back:hover { color: #fff; }
    .sandbox-header-name { font-size: 14px; font-weight: 600; color: #fff; flex: 1; }
    .sandbox-header-tag {
      font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 3px; padding: 3px 8px;
      white-space: nowrap;
    }

    /* ── Compact nav strip ── */
    .slide-nav {
      background: #f0f0f0;
      padding: 20px 0 10px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .slide-nav-inner {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 999px;
      padding: 5px 8px;
      gap: 2px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .nav-btn {
      background: none; border: none; cursor: pointer;
      color: #666; font-size: 15px; font-weight: 500;
      font-family: inherit; width: 36px; height: 36px;
      border-radius: 999px; display: flex; align-items: center; justify-content: center;
      transition: color 0.1s, background 0.1s;
      flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) { background: #f0f0f0; color: #111; }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }

    .nav-num {
      background: none; border: none; cursor: pointer;
      color: #888; font-size: 15px; font-weight: 500;
      font-family: inherit; width: 36px; height: 36px;
      border-radius: 999px; display: flex; align-items: center; justify-content: center;
      transition: color 0.1s, background 0.1s;
      flex-shrink: 0;
    }
    .nav-num:hover:not(.active) { background: #f0f0f0; color: #333; }
    .nav-num.active { background: #222; color: #fff; font-weight: 700; }
    #num-row { display: flex; align-items: center; gap: 2px; }

    /* ── Iframe ── */
    .slide-frame-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .slide-frame {
      position: absolute;
      top: 0; left: 0;
      width: calc(100% / 1.3);
      height: calc(100% / 1.3);
      border: none;
      background: #f0f0f0;
      transform: scale(1.3);
      transform-origin: top left;
    }
  </style>
</head>
<body>

  <header class="sandbox-header">
    <a class="sandbox-header-back" href="/sandbox.html">← Sandbox</a>
    <span class="sandbox-header-name">AI Review — Wireframes</span>
    <span class="sandbox-header-tag">Sandbox</span>
  </header>

  <div class="slide-nav">
    <div class="slide-nav-inner">
      <button class="nav-btn" id="btn-prev">‹</button>
      <div id="num-row"></div>
      <button class="nav-btn" id="btn-next">›</button>
    </div>
  </div>

  <div class="slide-frame-wrap">
    <iframe class="slide-frame" id="slide-frame" src=""></iframe>
  </div>

  <script>
    const slides = [
      { file: '/ai-review-wf-03-state-1-default.html',        title: 'State 1 — Default' },
      { file: '/ai-review-wf-04-state-2-ai-review-open.html', title: 'State 2 — AI Review Open' },
      { file: '/ai-review-wf-05-state-3-finding-detail.html', title: 'State 3 — Finding Detail' },
      { file: '/ai-review-wf-06-empty-state.html',            title: 'Empty State — No Issues Found' },
      { file: '/ai-review-wf-07-completion-state.html',       title: 'Completion State' },
    ];

    let current = 0;

    const frame   = document.getElementById('slide-frame');
    const numRow  = document.getElementById('num-row');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Build numbered buttons
    slides.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.className = 'nav-num' + (i === 0 ? ' active' : '');
      btn.textContent = i + 1;
      btn.addEventListener('click', () => goTo(i));
      numRow.appendChild(btn);
    });

    function goTo(i) {
      current = i;
      frame.src = slides[i].file;
      btnPrev.disabled = i === 0;
      btnNext.disabled = i === slides.length - 1;
      numRow.querySelectorAll('.nav-num').forEach((b, idx) =>
        b.classList.toggle('active', idx === i)
      );
      history.replaceState(null, '', '#' + (i + 1));
    }

    btnPrev.addEventListener('click', () => { if (current > 0) goTo(current - 1); });
    btnNext.addEventListener('click', () => { if (current < slides.length - 1) goTo(current + 1); });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft'  && current > 0)                goTo(current - 1);
      if (e.key === 'ArrowRight' && current < slides.length - 1) goTo(current + 1);
    });

    // Init — restore from URL hash if present
    const hashSlide = parseInt(window.location.hash.replace('#', '')) - 1;
    goTo((hashSlide >= 0 && hashSlide < slides.length) ? hashSlide : 0);
  </script>

</body>
</html>
